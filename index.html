<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CP Pulse — 1-Year Contest Tracker &amp; Gap Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var saved = localStorage.getItem("cp_pulse_theme");
        var isLight = saved ? saved === "light" : false;
        document.documentElement.classList.toggle("dark", !isLight);
        document.documentElement.classList.toggle("light", isLight);
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500/30 selection:text-sky-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
