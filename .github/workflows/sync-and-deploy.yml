name: Sync Rolling 12-Month CP Data & Deploy to GitHub Pages

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 IST) to refresh POTD, rolling 365-day contests & owner snapshot
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (firebase-admin for Firestore push)
        run: pip install firebase-admin --quiet

      - name: Sync contests, POTD, and push owner snapshot to Firestore
        env:
          # Public contest + POTD refresh (always)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Private owner sync → Firestore (skipped gracefully when secrets absent)
          OWNER_LC_HANDLE: ${{ vars.OWNER_LC_HANDLE }}
          OWNER_CF_HANDLE: ${{ vars.OWNER_CF_HANDLE }}
          OWNER_AC_HANDLE: ${{ vars.OWNER_AC_HANDLE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
        # Run full sync (not --public-only); Firestore push is a no-op when secrets are missing
        run: python scripts/sync_all.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_OWNER_EMAIL: ${{ vars.VITE_OWNER_EMAIL }}
          # CORS proxy URL for live LC + AtCoder browser fetches (deploy worker/cp-proxy.js first)
          VITE_CP_PROXY_URL: ${{ vars.VITE_CP_PROXY_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
